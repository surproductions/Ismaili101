name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project Ismaili101.xcodeproj \
            -target Ismaili101 \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report compile errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -40 | while read -r line; do echo "::error::$line"; done

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Ismaili101.app Payload/
          zip -qry Ismaili101-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Ismaili101-unsigned-ipa
          path: Ismaili101-unsigned.ipa

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ismaili 101 (latest build)
          body: |
            Unsigned build from commit ${{ github.sha }}.
            Install by signing with your own Apple ID (e.g. Sideloadly or AltStore), or build from Xcode.
          prerelease: true
          files: Ismaili101-unsigned.ipa
