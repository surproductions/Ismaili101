name: Simulator screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild \
            -project Ismaili101.xcodeproj \
            -target Ismaili101 \
            -configuration Debug \
            -sdk iphonesimulator \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -20
          exit ${PIPESTATUS[0]}

      - name: Report compile errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -40 | while read -r line; do echo "::error::$line"; done

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [(rt, d) for rt, ds in devices.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          phones.sort(key=lambda x: x[0], reverse=True)
          pro = [p for p in phones if "Pro" in p[1]["name"] and "Max" not in p[1]["name"]]
          print((pro or phones)[0][1]["udid"])
          ')
          echo "::notice::Simulator $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/Ismaili101.app

      - name: Capture screenshots
        run: |
          BUNDLE=com.example.ismaili101
          mkdir -p shots
          capture () {
            local mode=$1; shift
            for screen in "$@"; do
              xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
              xcrun simctl launch "$UDID" "$BUNDLE" -screen "$screen" >/dev/null
              sleep 5
              xcrun simctl io "$UDID" screenshot "shots/${mode}-${screen}.png" >/dev/null
            done
          }
          SCREENS="tutorial tutorial2 learn chapter daily path faith festivals about history imam journey figures impact agency contributions play jeopardy match truefalse timeline explore compare groups search"
          xcrun simctl ui "$UDID" appearance light
          capture light $SCREENS
          xcrun simctl ui "$UDID" appearance dark
          capture dark learn chapter imam journey agency jeopardy compare faith

      - name: Publish screenshots to the 'screenshots' branch
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
