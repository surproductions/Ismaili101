name: TestFlight setup check

# Lists the NAMES of repository secrets (never their values) and, if an App Store
# Connect API key is present, looks up the apps and bundle IDs on the account.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/testflight-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List secret names
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          NAMES=$(echo "$SECRETS_JSON" | jq -r 'keys[]' | grep -v '^github_token$' | paste -sd ',' -)
          echo "::notice title=Secret names::$NAMES"

      - name: Look up App Store Connect apps
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          pip install -q pyjwt cryptography requests
          python3 - <<'EOF'
          import base64, json, os, re, time
          import jwt, requests

          secrets = json.loads(os.environ["SECRETS_JSON"])
          def find(patterns, exclude=()):
              for name, value in secrets.items():
                  upper = name.upper()
                  if any(re.search(p, upper) for p in patterns) and not any(re.search(e, upper) for e in exclude):
                      return name, value
              return None, None

          key_name, key_id = find([r"KEY_?ID"])
          issuer_name, issuer = find([r"ISSUER"])
          pk_name, private_key = find([r"PRIVATE", r"P8", r"API_?KEY$", r"API_?KEY_?(CONTENT|BASE64|B64)", r"AUTH_?KEY"], exclude=[r"ID$", r"ISSUER"])
          print(f"::notice title=Detected::key id={key_name} issuer={issuer_name} private key={pk_name}")
          if not (key_id and issuer and private_key):
              print("::warning::Could not find all three App Store Connect API key secrets.")
              raise SystemExit(0)

          pem = private_key.strip()
          if "BEGIN PRIVATE KEY" not in pem:
              try:
                  pem = base64.b64decode(pem).decode()
              except Exception:
                  pass
          token = jwt.encode(
              {"iss": issuer.strip(), "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              pem, algorithm="ES256", headers={"kid": key_id.strip(), "typ": "JWT"})
          headers = {"Authorization": f"Bearer {token}"}

          apps = requests.get("https://api.appstoreconnect.apple.com/v1/apps?limit=50", headers=headers)
          if apps.status_code != 200:
              print(f"::error::App Store Connect API returned {apps.status_code}: {apps.text[:300]}")
              raise SystemExit(0)
          for app in apps.json().get("data", []):
              a = app["attributes"]
              print(f"::notice title=App::{a.get('name')} | bundle {a.get('bundleId')} | sku {a.get('sku')}")

          ids = requests.get("https://api.appstoreconnect.apple.com/v1/bundleIds?limit=200", headers=headers)
          for b in ids.json().get("data", []):
              a = b["attributes"]
              print(f"::notice title=Bundle ID::{a.get('identifier')} | team {a.get('seedId')} | {a.get('platform')}")

          certs = requests.get("https://api.appstoreconnect.apple.com/v1/certificates?limit=50", headers=headers)
          kinds = sorted({c["attributes"].get("certificateType") for c in certs.json().get("data", [])})
          print(f"::notice title=Certificates::{', '.join(k for k in kinds if k) or 'none'}")
          EOF
